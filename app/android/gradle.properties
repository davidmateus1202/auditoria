org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier reescribía librerías del soporte antiguo a AndroidX. Ningún
# complemento de este proyecto lo necesita, y no entiende el bytecode de las
# versiones recientes de Java: falla al transformar byte-buddy con
# "Unsupported class file major version". Se deja apagado.
android.enableJetifier=false
